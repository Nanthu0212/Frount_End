<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="base.css">

    <link rel="stylesheet" href="component.css">

</head>

<body>

    <header class="dashboard-header">

        <h1>Admin Dashboard</h1>

        <button class="btn">
            Logout
        </button>

    </header>


    <main class="dashboard">

        <div class="card">

            <h2>Users</h2>

            <p class="number">
                1,250
            </p>

            <button class="btn">
                View Users
            </button>

        </div>

        <div class="card">

            <h2>Orders</h2>

            <p class="number">
                850
            </p>

            <button class="btn">
                View Orders
            </button>

        </div>

        <div class="card">

            <h2>Revenue</h2>

            <p class="number">
                ₹2,50,000
            </p>

            <button class="btn">
                View Reports
            </button>

        </div>

    </main>

</body>
</html>
