<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fading box</title>
</head>
<style>
    body{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #765cd3;
    }
    .box{
        width: 200px;
        height: 200px;
        background-color: red;
        border-radius: 20px;
        animation: fade 6s infinite;
    }
    
    @keyframes fade {
        0% { opacity: 0; }
        50% { opacity: 1; }
        100% { opacity: 0; }
    }
</style>
<body>
    <div class="box" >
        <box>
           
        </box>
    </div>
</body>
</html>
