<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Card</title>
  <style>
    body {
      background-color: #f8fafc;
      font-family: sans-serif;
      padding: 40px 20px;
    }

    /* Card shell with internal padding and centered margins */
    .profile-card {
      width: 280px;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 24px;
      margin: 0 auto;
      text-align: center;
    }

    .avatar {
      width: 64px;
      height: 64px;
      line-height: 64px;
      background-color: #6366f1;
      color: #ffffff;
      border-radius: 50%;
      margin: 0 auto 16px auto;
      font-weight: bold;
    }

    .profile-name {
      margin: 0 0 4px 0;
      font-size: 18px;
      color: #0f172a;
    }

    .profile-role {
      margin: 0 0 16px 0;
      font-size: 14px;
      color: #64748b;
    }

    .profile-bio {
      margin: 0 0 20px 0;
      font-size: 13px;
      line-height: 1.5;
      color: #334155;
    }

    .profile-button {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <div class="avatar">NK</div>
    <h2 class="profile-name">Nanthu</h2>
    <p class="profile-role">Full Stack Developer</p>
    <p class="profile-bio">
      Building accessible user interfaces and modern layout architectures.
    </p>
    <button class="profile-button">View Profile</button>
  </div>

</body>
</html>
