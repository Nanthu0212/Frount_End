<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform Admin</title>
</head>
<style>
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, sans-serif;
  background-color: #f8fafc;
}

.dashboard-shell {
  display: grid;
  grid-template-rows: 60px auto 1fr;
  grid-template-areas:
    "navbar"
    "sidebar"
    "main";
  min-height: 100vh;
}

.dashboard-nav {
  grid-area: navbar;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.5rem;
  background-color: #0f172a;
  color: #f8fafc;
}

.dashboard-sidebar {
  grid-area: sidebar;
  background-color: #1e293b;
  padding: 1rem;
}

.dashboard-sidebar ul {
  display: flex;
  gap: 1rem;
  list-style: none;
}

.dashboard-sidebar a {
  color: #94a3b8;
  text-decoration: none;
}

.dashboard-main {
  grid-area: main;
  padding: 2rem;
  overflow-y: auto;
}
@media (min-width: 768px) {
  .dashboard-shell {
    height: 100vh;
    grid-template-rows: 60px 1fr;
    grid-template-columns: 240px 1fr;
    grid-template-areas:
      "navbar navbar"
      "sidebar main";
  }

  .dashboard-sidebar {
    overflow-y: auto;
  }

  .dashboard-sidebar ul {
    flex-direction: column;
    gap: 0.75rem;
  }
}
</style>
<body>
  <div class="dashboard-shell">
    <header class="dashboard-nav">
      <div class="nav-brand">Platform Admin</div>
      <div class="nav-profile">Profile</div>
    </header>

  <aside class="dashboard-sidebar">
    <nav>
      <ul>
        <li><a href="#">Overview</a></li>
        <li><a href="#">Analytics</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </nav>
  </aside>

  <main class="dashboard-main">
    <div class="main-content">
      <h2>System Dashboard</h2>
      <p>Main content scrolls smoothly inside this viewport container.</p>
    </div>
  </main>
</div>
