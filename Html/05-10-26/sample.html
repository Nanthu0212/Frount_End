<html>
  <head>
    <title>sample table</title>
    <style>
      .breadcrumb {
        padding: 15px;
        background-color: #f2f2f2;
      }
 
      .breadcrumb a {
        text-decoration: none;
      }
 
      .breadcrumb span {
        margin: 0 8px;
      }
 
      .box {
        width: 100px;
        height: 100px;
        background-color: blue;
        animation: moveBox 3s infinite;
      }
 
      @keyframes moveBox {
        0% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(500px);
        }
        100% {
          transform: translate(0);
        }
      }
    </style>
  </head>
  <body>
    <h3>Sample table design</h3>
    <div class="breadcrumb">
      <a href="#">Home</a>
      <span>></span>
      <a href="#">Products</a>
      <span>></span>
      <a href="#">Mobiles</a>
    </div>
    <table border="1">
      <tr>
        <th>S.No</th>
        <th>Name</th>
        <th>Age</th>
      </tr>
      <tr>
        <td>1</td>
        <td>Ram</td>
        <td></td>
      </tr>
      <tr>
        <td>2</td>
        <td>Ram</td>
        <td>22</td>
      </tr>
      <tr>
        <td>3</td>
        <td>Ram</td>
        <td>22</td>
      </tr>
      <tr>
        <td>4</td>
        <td>Ram</td>
        <td>22</td>
      </tr>
      <tr>
        <td>5</td>
        <td>Ram</td>
        <td>22</td>
      </tr>
    </table>
 
    <br />
    <details>
      <summary>ffffffff</summary>
      <p>dkshdsjfhjfhkfskfskfs</p>
    </details>
    <hr />
    <br />
    <div class="box"></div>
  </body>
</html>
